# .github/workflows/rss_update.yml

name: RSSフィード自動更新

# 書き込み権限を明示的に付与
permissions:
  contents: write
  actions: write  # keepalive アクションが GitHub API を利用するために必要

on:
  # ★★★ 毎週金曜日 中国時間14:00 に実行（UTC 6:00）★★★
  # cron: 分 時 日 月 曜日
  # 0 6 * * 5  = 毎週金曜日 06:00 UTC = 14:00 中国時間
  schedule:
    - cron: '0 6 * * 5'
  
  # 手動実行ボタン（テスト用）
  workflow_dispatch:

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    steps:
    # ステップ1: リポジトリのコードを取得
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # rebase を安全に行うため全履歴を取得
    
    # ステップ2: Pythonをインストール
    - name: Pythonをセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # ステップ3: 必要なライブラリをインストール
    - name: 依存関係をインストール
      run: |
        pip install -r requirements.txt
    
    # ステップ4: RSSフィードを生成
    - name: RSSフィードを生成
      run: |
        python create_rss.py
    
    # ステップ5: 変更をコミットしてプッシュ
    - name: 変更をコミットしてプッシュ
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add rss.xml
        git diff --staged --quiet || git commit -m "RSSフィードを自動更新 $(date '+%Y-%m-%d %H:%M:%S')"
        # リモートの変更を取り込んでからプッシュ（競合回避）
        git pull --rebase origin ${{ github.ref_name }}
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # ステップ6: 60日間の無効化対策（keepalive）
    - name: Keepalive（ワークフロー無効化防止）
      if: always()
      uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
      with:
        COMMIT_MESSAGE: "Keepalive: ワークフロー無効化防止"
        TIME_ELAPSED_THRESHOLD_IN_DAYS: 50
